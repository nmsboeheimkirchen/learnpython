name: Test and deploy static site

on:
  push:
    branches:
      - main
      - dev-login-save
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic and validator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Run logic and validator tests
        run: npm test

  browser:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-school-laptop
            engine: chromium
          - project: webkit-ipad
            engine: webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.engine }}

      - name: Download Chromium headless shell
        if: matrix.engine == 'chromium'
        run: npx playwright install --only-shell chromium

      - name: Download WebKit
        if: matrix.engine == 'webkit'
        run: npx playwright install webkit

      - name: Run browser end-to-end tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

  login-browser:
    name: Login and device-switch browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install local PHP test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:login

  backend:
    name: PHP API and MariaDB integration tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-test-root
          MARIADB_DATABASE: agentpy_test
          MARIADB_USER: agentpy_test
          MARIADB_PASSWORD: disposable-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PHP test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-sqlite3
      - name: Test real HTTP sessions and persistence on SQLite and MariaDB
        env:
          AGENTPY_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=agentpy_test;charset=utf8mb4
          AGENTPY_TEST_MYSQL_USER: agentpy_test
          AGENTPY_TEST_MYSQL_PASSWORD: disposable-test-password
        run: npm run test:backend
      - name: Test private Hostinger setup and release integrity
        run: npm run test:hosting

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - logic
      - browser
      - backend
      - login-browser
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare public static files only
        run: npm run build:pages

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/site-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify published Pages deployment
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify published commit and helicopter pages
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node tests/verify-pages-deployment.mjs
